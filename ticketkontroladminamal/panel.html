<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="theme-color" content="#200204" />
  <title>QR Tarama | AMAL Yönetim</title>
  <link rel="icon" href="../favicon.ico" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="panel.css" />
  <style>body{visibility:hidden}html.auth-ready body{visibility:visible}</style>
</head>
<body>
  <div class="scan-page">
    <video id="camera" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>

    <div class="scan-topbar">
      <div class="brandline">AMAL <span>Çalıştay</span></div>
      <div class="scan-hint">QR kodu çerçeveye getirin</div>
    </div>

    <div class="scan-bottom">
      <div class="shutter" aria-hidden="true"><span class="shutter-ring"></span></div>
    </div>

    <div class="cam-error is-hidden" id="cam-error">
      <div id="cam-error-msg">Kamera başlatılamadı.</div>
      <button class="btn small" id="retry-cam" type="button">Tekrar Dene</button>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <div class="sheet-backdrop" id="sheet-backdrop">
    <div class="sheet" id="sheet">
      <button class="sheet-close-x" id="sheet-close-x" type="button" aria-label="Kapat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
      <div class="brandline">Kişi Kartı</div>
      <div class="person-name" id="person-name">—</div>
      <div class="person-komite" id="person-komite">—</div>
      <div id="meal-area"></div>
      <div class="sheet-status" id="sheet-status"></div>
      <div class="confirm" id="confirm" aria-hidden="true">
        <div class="confirm-check">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"></path></svg>
        </div>
        <div class="confirm-text">Onaylandı</div>
      </div>
    </div>
  </div>

  <script src="jsqr.js" defer></script>
  <script src="guard.js" data-unauth="../" defer></script>
  <script src="panel.js" defer></script>
</body>
</html>
