        function Countdown() {
          const [time, setTime] = React.useState({
            days: 0,
            hours: 0,
            minutes: 0,
            seconds: 0,
          });

          React.useEffect(() => {
            const targetDate = new Date("2026-11-14T09:00:00+03:00").getTime();
            const updateTimer = () => {
              const now = new Date().getTime();
              const distance = targetDate - now;
              if (distance <= 0) {
                setTime({ days: 0, hours: 0, minutes: 0, seconds: 0 });
                return;
              }
              const days = Math.floor(distance / (1000 * 60 * 60 * 24));
              const hours = Math.floor(
                (distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60),
              );
              const minutes = Math.floor(
                (distance % (1000 * 60 * 60)) / (1000 * 60),
              );
              const seconds = Math.floor((distance % (1000 * 60)) / 1000);
              setTime({ days, hours, minutes, seconds });
            };
            updateTimer();
            const interval = setInterval(updateTimer, 1000);
            return () => clearInterval(interval);
          }, []);

          return (
            <div className="countdown flex flex-row gap-6">
              <div className="countdown-unit">
                <span className="countdown-value">{time.days}</span>
                <div className="countdown-label">Gün</div>
              </div>
              <div className="countdown-unit">
                <span className="countdown-value">{time.hours}</span>
                <div className="countdown-label">Saat</div>
              </div>
              <div className="countdown-unit">
                <span className="countdown-value">{time.minutes}</span>
                <div className="countdown-label">Dakika</div>
              </div>
              <div className="countdown-unit seconds">
                <span className="countdown-value">{time.seconds}</span>
                <div className="countdown-label">Saniye</div>
              </div>
            </div>
          );
        }

              const elementToGlitch = Math.random() > 0.5 ? "name" : "title";

        function Team() {
          const teamMembers = [

              image: "/team/halitbaskan.jpg",
            },
            {
              name: "Berra FAİK",

            /*   ,{

              image: "/team/yagmur.JPG",
            } */
          ];

          const teamRef = React.useRef(null);
          const memberRefs = React.useRef([]);
          const spotlightCount = 3;
          const [spotlights, setSpotlights] = React.useState(
            Array.from({ length: spotlightCount }, (_, i) => ({
              top: "50%",
              left: `${30 + i * 20}%`,
              width: "300px",
              height: "300px",
              opacity: 0,
            })),
          );

          const moveSpotlight = (index) => {
            const validRefs = memberRefs.current.filter(Boolean);
            if (!validRefs.length || !teamRef.current) return;
            const targetIndex = Math.floor(Math.random() * validRefs.length);
            const target = validRefs[targetIndex];
            if (!target) return;
            const targetRect = target.getBoundingClientRect();
            const sectionRect = teamRef.current.getBoundingClientRect();
            const baseSize = Math.max(targetRect.width, targetRect.height);
            const size = baseSize * (1.5 + Math.random() * 0.8);
            setSpotlights((current) => {
              const next = [...current];
              next[index] = {
                top: `${targetRect.top - sectionRect.top + targetRect.height / 2}px`,
                left: `${targetRect.left - sectionRect.left + targetRect.width / 2}px`,
                width: `${size}px`,
                height: `${size}px`,
                opacity: 0.4 + Math.random() * 0.35,
              };
              return next;
            });
          };

          React.useEffect(() => {
            const timers = [];
            const schedule = (index) => {
              const delay = 1800 + Math.random() * 3200;
              const timer = setTimeout(() => {
                moveSpotlight(index);
                schedule(index);
              }, delay);
              timers.push(timer);
            };
            const initial = setTimeout(() => {
              for (let i = 0; i < spotlightCount; i++) {
                setTimeout(() => {
                  moveSpotlight(i);
                  schedule(i);
                }, i * 250);
              }
            }, 500);
            return () => {
              clearTimeout(initial);
              timers.forEach(clearTimeout);
            };
          }, []);

          return (
            <section
              id="team"
              ref={teamRef}
              className="team-section section-dark"
            >
              <h2>Ekibimiz</h2>
              {spotlights.map((s, i) => (
                <div
                  key={i}
                  className={`team-spotlight team-spotlight-${i}`}
                  style={{
                    top: s.top,
                    left: s.left,
                    width: s.width,
                    height: s.height,
                    opacity: s.opacity,
                  }}
                />
              ))}
              <div className="team-grid">
                {teamMembers.map((member, index) => (
                  <TeamMember
                    key={index}
                    itemRef={(el) => (memberRefs.current[index] = el)}
                    name={member.name}
                    title={member.title}
                    image={member.image}
                  />
                ))}
              </div>
            </section>
          );
        }
